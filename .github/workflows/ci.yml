name: Public synthetic offline CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-unit-tests:
    name: Offline Python 3.11 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout approved public source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate public allowlist and SHA-256 manifest
        run: python ci/verify_snapshot.py
      - name: Install public offline dependencies
        run: python -m pip install '.[calendar]'
      - name: Run published synthetic tests (no secrets or HTTP)
        run: python -m unittest discover -s tests -q
        env:
          PYTHONPATH: src
      - name: Build wheel and source distribution
        run: python -m pip install build==1.2.2 && python -m build
