[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-dividend-etf-monitor"
version = "0.1.0"
description = "Broker-disconnected mechanical dividend ETF signal monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
calendar = ["exchange-calendars==4.13.2"]

[project.scripts]
schd-monitor = "schd_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
